# CR-10 V3 (300x300x400) + BTT SKR 2 (STM32F407) + TMC2209 UART
# Toolhead: Voron Stealthburner + HGX Lite 2.0 + Volcano (100k NTC)
# Boquilla 0.4 | Z: sonda inductiva (x_offset 40, y_offset -3)
# Migrado desde Creality 2.5.2: geometria y calibraciones heredadas.
# NOTAS SKR2:
#  - Jumpers UART puestos bajo cada driver (corriente por software).
#  - Sonda inductiva: senal al puerto PROBE (PE4). Si remontas el 3D Touch,
#    usa seccion [bltouch] con sensor_pin: ^PE4 y control_pin: PE5.
#  - Ventilador hotend en FAN1 (PB6), pieza en FAN0 (PB7).
#  - Sin [display]: la tactil stock DWIN no la soporta Klipper.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_3A002E000547393438343535-if00

# SKR2: sin este pin los drivers y FETs no reciben potencia
[output_pin motor_power]
pin: PC13
value: 1

[stepper_x]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: -34
position_min: -34
# RH: ventiladores/ABL a la derecha; margen para no golpear el marco
position_max: 290
homing_speed: 50

[stepper_y]
step_pin: PD5
dir_pin: !PD4
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: -26
position_min: -26
position_max: 270
homing_speed: 50

[stepper_z]
step_pin: PA15
dir_pin: PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 8
position_min: -5
position_max: 400
endstop_pin: probe:z_virtual_endstop
homing_speed: 4

# CR-10 V3: doble motor Z. El segundo va en el slot E1.
[stepper_z1]
step_pin: PD11
dir_pin: PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_x]
uart_pin: PE0
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PD3
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PD0
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PD12
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC6
# HGX NEMA14 pancake: valor de arranque; vigila temp del motor 10 min
run_current: 0.500
stealthchop_threshold: 999999

[extruder]
step_pin: PD15
# Si extruye al reves, quita o agrega el "!"
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
full_steps_per_rotation: 200
# HGX Lite 2.0 — calibrado: pidió 100 salieron ~75 -> 17.01; +3 mm/100 manda 16.51
rotation_distance: 15.68
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 120
max_extrude_only_velocity: 25
max_extrude_only_accel: 1500
pressure_advance: 0
pressure_advance_smooth_time: 0.040
heater_pin: PB3
# Revo clone: termistor 104NT en el nucleo ceramico (NO EPCOS)
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
#control: pid
#pid_Kp: 42.965
#pid_Ki: 3.978
#pid_Kd: 116.005
min_temp: 0
max_temp: 290
min_extrude_temp: 170

[verify_heater extruder]
max_error: 200
check_gain_time: 120
hysteresis: 10
heating_gain: 1.0

[heater_bed]
heater_pin: PD7
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA1
#control: pid
#pid_Kp: 201.86
#pid_Ki: 10.67
#pid_Kd: 954.96
min_temp: 0
max_temp: 130

[fan]
pin: PB7

[heater_fan hotend_fan]
pin: PB6

[safe_z_home]
# Home Z con la SONDA en el centro de la cama (nozzle = centro - offset)
home_xy_position: 115, 140
speed: 80
z_hop: 30
z_hop_speed: 10

[printer]
kinematics: cartesian
# Revo ceramico: ~2x del stock (equivalente a M220 200%)
max_velocity: 300
# Limite segun calibrate_shaper (ei X/Y ~1800–1900)
max_accel: 1800
square_corner_velocity: 8
max_z_velocity: 12
max_z_accel: 100

# Input shaper — ADXL 2026-08-27 (ei X 32.6 / Y 31.4)
[input_shaper]
shaper_type_x: ei
shaper_freq_x: 32.6
shaper_type_y: ei
shaper_freq_y: 31.4

[force_move]
enable_force_move: True

[pause_resume]
recover_velocity: 50

# Runout comentado como antes; OJO: en SKR2 el pin seria otro (revisar cableado)
#[filament_switch_sensor fil_runout_sensor]
#pause_on_runout: True
#switch_pin: PE4

[exclude_object]

# Tornillos en coordenadas de BOQUILLA (cama 300, Y remapeada al frente)
# Si no caen encima, anota X/Y reales y los ajustamos
[bed_screws]
screw1: 33, 29
screw1_name: front left screw
screw2: 273, 29
screw2_name: front right screw
screw3: 273, 269
screw3_name: rear right screw
screw4: 33, 269
screw4_name: rear left screw

# Sonda inductiva. Siempre activa: no usa servo ni control_pin.
# Detecta metal (cama de aluminio).
[probe]
pin: ^PE4
x_offset: 40
y_offset: -3
# z_offset heredado del SAVE_CONFIG anterior; revalidar con CALIBRAR_Z
#z_offset: 0.760
speed: 5.0
samples: 2
sample_retract_dist: 3.0
samples_result: average

[bed_mesh]
speed: 80
horizontal_move_z: 6
# Coordenadas de la SONDA. Cubre casi toda la cama (malla fresca pendiente)
mesh_min: 10, 10
mesh_max: 245, 240
probe_count: 11, 10
algorithm: bicubic
fade_start: 1
fade_end: 10

[screws_tilt_adjust]
# Boquilla donde la sonda queda sobre cada tornillo (offset 35, 10)
screw1: -7, 3
screw1_name: front left screw
screw2: 233, 3
screw2_name: front right screw
screw3: 233, 248
screw3_name: rear right screw
screw4: -7, 248
screw4_name: rear left screw
speed: 50
horizontal_move_z: 10
screw_thread: CW-M3

[include mainsail.cfg]
# Pico+ADXL solo para recalibrar; descomenta con el sensor conectado
#[include adxl.cfg]

# Velocidad (M220) y flujo (M221) del menu: se guardan y sobreviven reinicios
[save_variables]
filename: /home/levi/printer_data/config/variables.cfg

[virtual_sdcard]
path: /home/levi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# OrcaSlicer: START_PRINT BED_TEMP=... EXTRUDER_TEMP=...  (tambien acepta BED / EXTRUDER)
[gcode_macro START_PRINT]
gcode:
    {% set BED = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(220))|float %}
    {% set sv = printer.save_variables.variables %}
    {% set speed = sv.speed_factor|default(100)|float %}
    {% set flow = sv.flow_factor|default(100)|float %}
    # Tope del input shaper (ei). No subir a 2000: reaparece ghosting
    SET_VELOCITY_LIMIT VELOCITY=250 ACCEL=1800 SQUARE_CORNER_VELOCITY=5
    SET_PRESSURE_ADVANCE ADVANCE=0
    M220.1 S{speed}
    M221.1 S{flow}
    M140 S{BED}
    # Precalentado simple y robusto. M190 con el TARGET COMPLETO {BED} nunca
    # enfría la cama (el bug anterior era M190 con target menor). Boquilla por
    # escalones guardados por temperatura, sin loops ni staging que se atoren.
    {% if printer.extruder.temperature < 150 %}
    M104 S150
    {% endif %}
    M190 S{BED}
    {% if printer.extruder.temperature < 200 %}
    M104 S200
    {% endif %}
    {% set ext_t = EXTRUDER|float %}
    {% if printer.extruder.temperature < ext_t %}
    M104 S{ext_t|int}
    {% endif %}
    # Home DESPUES de temp: menos corriente PWM en el loom (heater+sonda juntos)
    G28
    G90
    G1 Z10 F600
    # Malla guardada (SAVE_CONFIG). Para rehacerla: macro MALLA_CAMA.
    BED_MESH_PROFILE LOAD=default
    M109 S{EXTRUDER}
    G92 E0
    # Linea de purga sobre X, borde delantero (Y min -16; ~3 cm mas al frente que Y5)
    G1 X25 Y-12 Z0.3 F6000
    G1 X250 E35 F600
    G1 X255 F5000
    G92 E0

[gcode_macro END_PRINT]
gcode:
    M400
    G92 E0
    G1 E-2 F1800
    TURN_OFF_HEATERS
    M107
    # No resetea M220/M221: quedan los del menu
    G91
    G1 Z10 F600
    G90
    G1 X10 Y270 F6000
    M84

# Compatibilidad si Orca aun llama PRINT_START / PRINT_END
[gcode_macro PRINT_START]
gcode:
    START_PRINT BED_TEMP={params.BED_TEMP|default(params.BED|default(60))} EXTRUDER_TEMP={params.EXTRUDER_TEMP|default(params.EXTRUDER|default(220))}

[gcode_macro PRINT_END]
gcode:
    END_PRINT

# Intercepta cambios del menu (Mainsail / LCD) y los guarda en disco
[gcode_macro M220]
rename_existing: M220.1
description: Factor de velocidad (%); se guarda entre reinicios
gcode:
    {% set S = params.S|default(printer.gcode_move.speed_factor * 100)|float %}
    M220.1 S{S}
    SAVE_VARIABLE VARIABLE=speed_factor VALUE={S}
    RESPOND MSG="Velocidad guardada: {S|int}%"

[gcode_macro M221]
rename_existing: M221.1
description: Factor de flujo (%); se guarda entre reinicios
gcode:
    {% set S = params.S|default(printer.gcode_move.extrude_factor * 100)|float %}
    M221.1 S{S}
    SAVE_VARIABLE VARIABLE=flow_factor VALUE={S}
    RESPOND MSG="Flujo guardado: {S|int}%"

# Al arrancar Klipper, restaura velocidad y flujo guardados
[delayed_gcode RESTORE_SPEED_FLOW]
initial_duration: 2.0
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set speed = sv.speed_factor|default(100)|float %}
    {% set flow = sv.flow_factor|default(100)|float %}
    M220.1 S{speed}
    M221.1 S{flow}
    RESPOND MSG="Restaurado: velocidad {speed|int}% / flujo {flow|int}%"

# Botones utiles en Mainsail
[gcode_macro GUARDAR_VELOCIDAD_FLUJO]
description: Guarda la velocidad y flujo actuales del menu
gcode:
    {% set speed = printer.gcode_move.speed_factor * 100 %}
    {% set flow = printer.gcode_move.extrude_factor * 100 %}
    SAVE_VARIABLE VARIABLE=speed_factor VALUE={speed}
    SAVE_VARIABLE VARIABLE=flow_factor VALUE={flow}
    RESPOND MSG="Guardado: velocidad {speed|int}% / flujo {flow|int}%"

[gcode_macro RESET_VELOCIDAD_FLUJO]
description: Vuelve velocidad y flujo a 100% y lo guarda
gcode:
    M220 S100
    M221 S100

# Orca a veces emite limites Marlin; Klipper no los usa (ignorar)
[gcode_macro M201]
description: Ignora aceleracion Marlin (usar SET_VELOCITY_LIMIT)
gcode:
    {% if False %}
    {% endif %}

[gcode_macro M203]
description: Ignora velocidad max Marlin
gcode:
    {% if False %}
    {% endif %}

[gcode_macro M205]
description: Ignora jerk Marlin
gcode:
    {% if False %}
    {% endif %}

[gcode_macro M486]
description: Ignora excluir objeto de OrcaSlicer (M486)
gcode:
    {% if False %}
    {% endif %}

# Botones en Mainsail
[gcode_macro AJUSTAR_TORNILLOS]
description: Home y mide inclinacion en los 4 tornillos (sin calentar)
gcode:
    G28
    SCREWS_TILT_CALCULATE

[gcode_macro CALIBRAR_Z]
description: Calienta 60/200, home y calibra z_offset de la sonda (ACCEPT + SAVE_CONFIG)
gcode:
    M140 S60
    M104 S200
    M190 S60
    M109 S200
    G28
    PROBE_CALIBRATE

[gcode_macro MALLA_CAMA]
description: Home y malla 5x5 (luego SAVE_CONFIG en Mainsail)
gcode:
    G28
    BED_MESH_CALIBRATE
    RESPOND MSG="Malla lista. Pulsa SAVE_CONFIG para guardarla como default."

[gcode_macro G29]
description: Malla de cama (compatibilidad Marlin/Orca)
gcode:
    BED_MESH_CALIBRATE
    RESPOND MSG="Malla lista. Pulsa SAVE_CONFIG para guardarla como default."

[gcode_macro TEST_SONDA]
description: Baja y sube el pin del 3D Touch (sin homing)
gcode:
    BLTOUCH_DEBUG COMMAND=pin_down
    G4 P1000
    BLTOUCH_DEBUG COMMAND=pin_up
    QUERY_PROBE

[gcode_macro SUBIR_Z]
description: Sube el cabezal 20 mm sin hacer home (si quedo abajo o en shutdown)
gcode:
    SET_KINEMATIC_POSITION Z=0
    G91
    G1 Z20 F300
    G90
    RESPOND MSG="Cabezal subido 20 mm (sin home). Repite SUBIR_Z si hace falta."

[gcode_macro BAJAR_Z]
description: Baja el cabezal 20 mm sin hacer home (vigila que no choque con la cama)
gcode:
    SET_KINEMATIC_POSITION Z=100
    G91
    G1 Z-20 F300
    G90
    RESPOND MSG="Cabezal bajado 20 mm (sin home). Repite BAJAR_Z si hace falta. Luego G28."

[gcode_macro PID_CAMA]
description: PID cama a 60C (luego SAVE_CONFIG)
gcode:
    M107
    PID_CALIBRATE HEATER=heater_bed TARGET=60

[gcode_macro PID_EXTRUSOR]
description: PID extrusor a 220C con fan de pieza al 100% (luego SAVE_CONFIG)
gcode:
    M107
    M109 S220
    M106 S255
    PID_CALIBRATE HEATER=extruder TARGET=220
    M107

