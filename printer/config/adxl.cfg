# Pico + ADXL345 — cableado correcto
# SDO→GP0  CS→GP1  SCL→GP2  SDA→GP3  VCC→3V3  GND→GND

[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_503359278A918A1F-if00

[adxl345]
cs_pin: adxl:gpio1
spi_software_sclk_pin: adxl:gpio2
spi_software_mosi_pin: adxl:gpio3
spi_software_miso_pin: adxl:gpio0
spi_speed: 500000

[resonance_tester]
accel_chip: adxl345
probe_points: 150, 140, 20
